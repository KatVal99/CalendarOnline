services:
  postgres:
    image: 'postgres:16'
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: budgetdb
      POSTGRES_USER: budget
      POSTGRES_PASSWORD: budget

  redis:
    image: 'redis:latest'
    ports:
      - '6380:6379'

  mailpit:
    image: 'axllent/mailpit:latest'
    ports:
      - '1025:1025'
      - '8025:8025'

