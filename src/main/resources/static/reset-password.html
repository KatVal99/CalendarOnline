<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Club – Nuova password</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="pixelStarsLayer" class="pixel-stars-layer" aria-hidden="true"></div>
<div class="container retro" style="max-width:480px">
    <header class="top-strip">
        <div class="brand">★ Budget Club ★</div>
        <div class="status-light blink">RESET</div>
    </header>

    <div class="page-hero" style="text-align:center">
        <h1>Nuova password</h1>
        <p>Scegli una nuova password sicura per il tuo account.</p>
    </div>

    <section class="card" id="formSection">
        <form id="resetConfirmForm">
            <input type="hidden" id="tokenField" name="token">
            <input name="newPassword" type="password" placeholder="Nuova password (min 8 caratteri)"
                   autocomplete="new-password" required>
            <input name="confirmPassword" type="password" placeholder="Ripeti la nuova password"
                   autocomplete="new-password" required>
            <button type="submit">Imposta nuova password</button>
        </form>
        <div id="resetConfirmInfo" class="small-note"></div>
    </section>

    <section class="card" id="invalidSection" hidden>
        <p class="muted">Il link non è valido o è scaduto.</p>
        <a href="login.html" style="color:#7a2b58">← Torna al login e richiedi un nuovo reset</a>
    </section>

    <footer class="status-bar">
        <span>Budget Club Engine v2.0</span>
        <span id="liveClock">--:--:--</span>
    </footer>
</div>

<script src="layout.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');

    if (!token) {
        document.getElementById('formSection').hidden = true;
        document.getElementById('invalidSection').hidden = false;
        return;
    }

    document.getElementById('tokenField').value = token;

    document.getElementById('resetConfirmForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const form = e.target;
        const info = document.getElementById('resetConfirmInfo');
        const newPassword = form.newPassword.value;
        const confirmPassword = form.confirmPassword.value;

        if (newPassword !== confirmPassword) {
            info.textContent = '⚠ Le password non coincidono.';
            info.style.color = '#d13e8b';
            return;
        }
        if (newPassword.length < 8) {
            info.textContent = '⚠ La password deve avere almeno 8 caratteri.';
            info.style.color = '#d13e8b';
            return;
        }

        try {
            const response = await fetch('/api/auth/reset-password/confirm', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token, newPassword })
            });
            const data = await response.json();
            if (response.ok) {
                info.textContent = '✓ Password aggiornata! Reindirizzamento al login...';
                info.style.color = '#2b7a5b';
                form.reset();
                setTimeout(() => { window.location.href = 'login.html'; }, 2000);
            } else {
                info.textContent = '⚠ ' + (data.error || data.message || 'Errore. Il link potrebbe essere scaduto.');
                info.style.color = '#d13e8b';
            }
        } catch (err) {
            info.textContent = '⚠ Errore di connessione.';
            info.style.color = '#d13e8b';
        }
    });
});
</script>
</body>
</html>
