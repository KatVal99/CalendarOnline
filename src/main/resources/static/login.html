<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Club – Accesso</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="pixelStarsLayer" class="pixel-stars-layer" aria-hidden="true"></div>
<div class="container retro" style="max-width:540px">
    <header class="top-strip">
        <div class="brand">★ Budget Club ★</div>
        <div class="status-light blink">ONLINE</div>
    </header>
    <marquee class="ticker" behavior="scroll" direction="left">benvenuto nel budget club – accedi o crea il tuo account</marquee>

    <div class="page-hero" style="text-align:center">
        <h1>Accesso</h1>
        <p>Inserisci le tue credenziali per entrare nella dashboard.</p>
    </div>

    <!-- LOGIN -->
    <section class="card" id="loginSection">
        <h2>Accedi</h2>
        <form id="loginForm">
            <input name="email" type="email" placeholder="Email" autocomplete="email" required>
            <input name="password" type="password" placeholder="Password" autocomplete="current-password" required>
            <button type="submit">Entra</button>
        </form>
        <div id="loginInfo" class="small-note"></div>
        <div style="margin-top:10px;display:flex;gap:10px;flex-wrap:wrap">
            <button type="button" id="showRegisterBtn" style="background:#fff;color:#7a2b58;border:2px solid #ffa5d2">
                Crea nuovo account
            </button>
            <button type="button" id="showResetBtn" style="background:#fff;color:#7a2b58;border:2px solid #ffa5d2">
                Password dimenticata?
            </button>
        </div>
    </section>

    <!-- REGISTRAZIONE -->
    <section class="card" id="registerSection" hidden>
        <h2>Crea account</h2>
        <form id="createUserForm">
            <input name="username" placeholder="Username" autocomplete="username" required>
            <input name="password" type="password" placeholder="Password (min 8 caratteri)" autocomplete="new-password" required>
            <input name="email" type="email" placeholder="Email (per report e reset password)" required>
            <button type="submit">Registrati</button>
        </form>
        <div id="createUserInfo" class="small-note"></div>
        <button type="button" id="backToLoginFromRegister" style="background:#fff;color:#7a2b58;border:2px solid #ffa5d2;margin-top:10px">
            ← Torna al login
        </button>
    </section>

    <!-- RESET PASSWORD -->
    <section class="card" id="resetSection" hidden>
        <h2>Reset password</h2>
        <p class="muted">Inserisci la tua email: ti invieremo un link per impostare una nuova password.</p>
        <form id="resetRequestForm">
            <input name="email" type="email" placeholder="La tua email" required>
            <button type="submit">Invia link di reset</button>
        </form>
        <div id="resetInfo" class="small-note"></div>
        <button type="button" id="backToLoginFromReset" style="background:#fff;color:#7a2b58;border:2px solid #ffa5d2;margin-top:10px">
            ← Torna al login
        </button>
    </section>

    <footer class="status-bar">
        <span>Budget Club Engine v2.0</span>
        <span id="liveClock">--:--:--</span>
    </footer>
</div>

<script src="common.js"></script>
<script src="layout.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    // Se già loggato, vai direttamente alla dashboard
    const stored = localStorage.getItem('budgetAuthHeader');
    if (stored) {
        window.location.href = 'index.html';
        return;
    }

    // Navigazione sezioni
    document.getElementById('showRegisterBtn').addEventListener('click', () => {
        document.getElementById('loginSection').hidden = true;
        document.getElementById('registerSection').hidden = false;
        document.getElementById('resetSection').hidden = true;
    });
    document.getElementById('showResetBtn').addEventListener('click', () => {
        document.getElementById('loginSection').hidden = true;
        document.getElementById('registerSection').hidden = true;
        document.getElementById('resetSection').hidden = false;
    });
    document.getElementById('backToLoginFromRegister').addEventListener('click', () => {
        document.getElementById('loginSection').hidden = false;
        document.getElementById('registerSection').hidden = true;
    });
    document.getElementById('backToLoginFromReset').addEventListener('click', () => {
        document.getElementById('loginSection').hidden = false;
        document.getElementById('resetSection').hidden = true;
    });

    // Login
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const form = e.target;
        const info = document.getElementById('loginInfo');
        const email = form.email.value.trim().toLowerCase();
        const password = form.password.value;

        if (!email || !password) {
            BudgetApp.showErrorModal(400, 'username, password e email sono obbligatori');
            return;
        }

        const token = btoa(`${email}:${password}`);
        const authHeader = `Basic ${token}`;

        // Verifica credenziali chiamando la dashboard
        try {
            const response = await fetch('/api/budget/dashboard', {
                headers: { Authorization: authHeader }
            });
            if (response.ok || response.status === 200) {
                localStorage.setItem('budgetAuthHeader', authHeader);
                localStorage.setItem('budgetEmail', email);
                window.location.href = 'index.html';
            } else if (response.status === 401) {
                BudgetApp.showErrorModal(401, 'Credenziali non valide');
            } else {
                // Connesso ma errore generico, accettiamo lo stesso
                localStorage.setItem('budgetAuthHeader', authHeader);
                localStorage.setItem('budgetEmail', email);
                window.location.href = 'index.html';
            }
        } catch (err) {
            BudgetApp.handleNetworkError(err);
        }
    });

    // Registrazione
    document.getElementById('createUserForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const form = e.target;
        const info = document.getElementById('createUserInfo');
        try {
            const response = await fetch('/api/operator/users', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: form.username.value,
                    password: form.password.value,
                    email: form.email.value
                })
            });
            if (response.ok) {
                info.textContent = '✓ Account creato! Ora puoi accedere.';
                info.style.color = '#2b7a5b';
                form.reset();
                setTimeout(() => {
                    document.getElementById('loginSection').hidden = false;
                    document.getElementById('registerSection').hidden = true;
                    document.getElementById('createUserInfo').textContent = '';
                }, 1800);
            } else {
                const text = await response.text();
                BudgetApp.showErrorModal(response.status, text);
            }
        } catch (err) {
            BudgetApp.handleNetworkError(err);
        }
    });

    // Reset password
    document.getElementById('resetRequestForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const form = e.target;
        const info = document.getElementById('resetInfo');
        try {
            await fetch('/api/auth/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: form.email.value })
            });
            info.textContent = '✓ Se l\'email è registrata, riceverai un link a breve. Controlla anche la cartella spam.';
            info.style.color = '#2b7a5b';
            form.reset();
        } catch (err) {
            info.textContent = '⚠ Errore di connessione.';
            info.style.color = '#d13e8b';
        }
    });
});
</script>
</body>
</html>
