spring.application.name=CalendarOnline

spring.kafka.bootstrap-servers=localhost:9094
spring.kafka.consumer.group-id=budget-consumer-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.calendaronline.budget
spring.kafka.consumer.properties.spring.json.value.default.type=com.example.calendaronline.budget.model.BudgetEvent

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

app.kafka.topic=budget-events

spring.datasource.url=jdbc:postgresql://localhost:5432/budgetdb
spring.datasource.username=budget
spring.datasource.password=budget
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

app.security.user1.username=mario
app.security.user1.password=password123
app.security.user2.username=luigi
app.security.user2.password=password123

# Configura SMTP reale per attivare le email di report mensile.
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

