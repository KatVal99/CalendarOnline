spring.application.name=CalendarOnline

# Render Port Binding
server.port=${PORT:8080}

# PostgreSQL Driver & Cloud Environment Override (Multiple Fallbacks)
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/budgetdb}}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:budget}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:budget}}

# Disable prepared statements for Supabase Transaction Pooler (PgBouncer)
spring.datasource.hikari.data-source-properties.prepareThreshold=0

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.flyway.enabled=false


app.security.user1.username=mario
app.security.user1.password=password123
app.security.user2.username=luigi
app.security.user2.password=password123
app.jwt.secret=${JWT_SECRET:CalendarOnlineSecretKeyForJwtAuthenticationWhichIsVeryLongAndSecure12345}

# Mail configuration
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000